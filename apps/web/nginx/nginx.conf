worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # /assets/* — content-hashed by Vite (e.g. workflow-disabled-overlay-BX-RCzrV.js).
    # Filename changes when content changes → safe to cache for 1 year + immutable.
    # Browsers (Android Chrome especially) skip revalidation for `immutable`, so
    # bumping cache size has zero downside here.
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      # `add_header` does NOT inherit across location blocks — re-emit security headers.
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-XSS-Protection "1; mode=block" always;
      try_files $uri =404;
    }

    # Entry points + PWA control files — MUST never be cached, otherwise a stale
    # index.html will reference asset hashes that no longer exist on the server
    # (or worse: still exist but render old code). This is the root cause of
    # "I cleared cache and the change still doesn't show up" reports on mobile.
    location ~* ^/(index\.html|sw\.js|sw\.js\.map|workbox-.*\.js|workbox-.*\.js\.map|manifest\.json|site\.webmanifest\.json)$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires off;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-XSS-Protection "1; mode=block" always;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
      # SPA fallback: the served body is index.html → must not be cached either.
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires off;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-XSS-Protection "1; mode=block" always;
    }
  }
}

